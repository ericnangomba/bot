provider: live
providers:
  ollama:
    kind: ollama
    base_url: http://127.0.0.1:11434
    rpm: 60
    concurrency: 1
    timeout_seconds: 30
  llamacpp:
    kind: llama_cpp
    base_url: http://127.0.0.1:8080/v1
    enabled: false
    rpm: 60
    concurrency: 1
    context_length: 16384
  google:
    kind: openai_compatible
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    key_env: GEMINI_API_KEY
    rpm: 8
    concurrency: 2
  groq:
    kind: openai_compatible
    base_url: https://api.groq.com/openai/v1
    key_env: GROQ_API_KEY
    rpm: 12
    concurrency: 2
  openrouter:
    kind: openai_compatible
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    rpm: 8
    concurrency: 2
  mistral:
    kind: openai_compatible
    base_url: https://api.mistral.ai/v1
    key_env: MISTRAL_API_KEY
    rpm: 4
    concurrency: 1
  openai:
    kind: openai_compatible
    base_url: https://api.openai.com/v1
    key_env: OPENAI_API_KEY
    output_parameter: max_completion_tokens
    rpm: 20
    concurrency: 3
models:
  local_general:
    provider: ollama
    name: qwen2.5:7b
    input_usd_m: 0
    output_usd_m: 0
  local_gguf:
    provider: llamacpp
    name: team-local
    input_usd_m: 0
    output_usd_m: 0
  gemini_free:
    provider: google
    name: gemini-2.5-flash-lite
    input_usd_m: 0
    output_usd_m: 0
  groq_free:
    provider: groq
    name: llama-3.1-8b-instant
    input_usd_m: 0
    output_usd_m: 0
  openrouter_free:
    provider: openrouter
    name: openrouter/free
    input_usd_m: 0
    output_usd_m: 0
  mistral_experiment:
    provider: mistral
    name: mistral-small-latest
    input_usd_m: 0
    output_usd_m: 0
  openai_mini:
    provider: openai
    name: gpt-4.1-mini
    input_usd_m: 0.4
    output_usd_m: 1.6
inference:
  context_length: 16384
  keep_alive: 120
  temperature: 0.1
  concurrency: 2
  local_max_parallel: 1
  local_max_loaded_models: 1
  local_idle_seconds: 120
director:
  primary: local_general
  fallbacks: [local_gguf, gemini_free, openrouter_free]
bots:
  - id: researcher
    capabilities: [research]
    primary: local_general
    fallbacks: [local_gguf, gemini_free, groq_free]
    slots: 2
    tools: [read, write, search, fetch]
    persona: Gather and verify facts. Cite URLs or attachment paths. Return findings, citations, and gaps.
  - id: builder
    capabilities: [build]
    primary: local_general
    fallbacks: [local_gguf, gemini_free, openrouter_free]
    inference: {temperature: 0.1, concurrency: 1}
    slots: 2
    tools: [read, write, exec, patch]
    persona: Write code and tests and run tests in the sandbox. Report artifacts and test evidence. Use patch for changes against supplied files.
  - id: reviewer
    capabilities: [review]
    primary: local_general
    fallbacks: [local_gguf, gemini_free, openrouter_free]
    inference: {temperature: 0}
    slots: 2
    tools: [read, exec]
    persona: Independently check requirements, edge cases, safety, and test evidence. Give a pass or fail verdict and concrete repair feedback.
  - id: ops
    capabilities: [ops]
    primary: local_general
    fallbacks: [local_gguf, groq_free, gemini_free]
    slots: 1
    tools: [read, publish, integration, pull_request, schedule]
    persona: Use named destinations and approved operational actions. Report execution receipts and pending decisions.
  - id: writer
    capabilities: [write]
    primary: local_general
    fallbacks: [local_gguf, groq_free, gemini_free, mistral_experiment]
    slots: 2
    tools: [read, write]
    persona: Deliver a clear report grounded in dependency outputs. Include evidence, artifacts, and outstanding work.
policy:
  autonomy: safe
  disabled_tools: []
  fetch_hosts: [docs.python.org, www.sqlite.org, en.wikipedia.org]
  integrations: {}
  github_repo: ""
  sandbox_image: botteam-sandbox:local
  sandbox_required: true
  max_parallel: 4
  model_rpm: 25
  model_timeout_seconds: 45
  tool_timeout_seconds: 30
  token_budget: 180000
  budget_usd: 0
  max_input_tokens: 24000
  max_output_tokens: 2800
  max_turns: 12
  max_attempts: 3
  max_repairs: 2
